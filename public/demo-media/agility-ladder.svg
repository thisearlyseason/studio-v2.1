<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bf171d"/></marker></defs><rect width="1200" height="800" fill="#faf8f3"/><text x="42" y="47" font-family="Arial,sans-serif" font-size="19" fill="#bf171d">THE SQUAD / PRACTICE DIAGRAM</text><text x="42" y="100" font-family="Arial,sans-serif" font-size="38" fill="#171717">Agility Ladder &amp; Speed Drills</text><text x="42" y="140" font-family="Arial,sans-serif" font-size="21" fill="#555">Use floor markings or a ladder; prioritize controlled footwork.</text><rect x="36" y="170" width="735" height="535" rx="24" fill="white" stroke="#ccc"/><rect x="220" y="210" width="150" height="58" fill="none" stroke="#777" stroke-width="4"/><rect x="220" y="268" width="150" height="58" fill="none" stroke="#777" stroke-width="4"/><rect x="220" y="326" width="150" height="58" fill="none" stroke="#777" stroke-width="4"/><rect x="220" y="384" width="150" height="58" fill="none" stroke="#777" stroke-width="4"/><rect x="220" y="442" width="150" height="58" fill="none" stroke="#777" stroke-width="4"/><rect x="220" y="500" width="150" height="58" fill="none" stroke="#777" stroke-width="4"/><rect x="220" y="558" width="150" height="58" fill="none" stroke="#777" stroke-width="4"/><circle cx="295" cy="648" r="27" fill="#bf171d"/><text x="287" y="656" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><path d="M420 625 L420 255" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><text x="475" y="340" font-family="Arial,sans-serif" font-size="25" fill="#171717">Controlled steps</text><text x="475" y="380" font-family="Arial,sans-serif" font-size="25" fill="#171717">Eyes forward</text><text x="475" y="420" font-family="Arial,sans-serif" font-size="25" fill="#171717">Soft landings</text><circle cx="830" cy="230" r="27" fill="#bf171d"/><text x="822" y="238" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><text x="875" y="224" font-family="Arial,sans-serif" font-size="21" fill="#171717">Step into each</text><text x="875" y="253" font-family="Arial,sans-serif" font-size="21" fill="#171717">space with light,</text><text x="875" y="282" font-family="Arial,sans-serif" font-size="21" fill="#171717">balanced contacts.</text><circle cx="830" cy="375" r="27" fill="#bf171d"/><text x="822" y="383" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><text x="875" y="369" font-family="Arial,sans-serif" font-size="21" fill="#171717">Repeat sideways</text><text x="875" y="398" font-family="Arial,sans-serif" font-size="21" fill="#171717">in both directions</text><text x="875" y="427" font-family="Arial,sans-serif" font-size="21" fill="#171717">at a steady pace.</text><circle cx="830" cy="520" r="27" fill="#bf171d"/><text x="822" y="528" font-family="Arial,sans-serif" font-size="23" fill="white">3</text><text x="875" y="514" font-family="Arial,sans-serif" font-size="21" fill="#171717">Walk back, recover,</text><text x="875" y="543" font-family="Arial,sans-serif" font-size="21" fill="#171717">then repeat with</text><text x="875" y="572" font-family="Arial,sans-serif" font-size="21" fill="#171717">consistent form.</text><text x="42" y="755" font-family="Arial,sans-serif" font-size="20" fill="#555">Solid arrows: movement   /   Dashed arrows: pass   /   Adapt spacing and pace to your group.</text></svg>
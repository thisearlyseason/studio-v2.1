<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bf171d"/></marker></defs><rect width="1200" height="800" fill="#faf8f3"/><text x="42" y="47" font-family="Arial,sans-serif" font-size="19" fill="#bf171d">THE SQUAD / PRACTICE DIAGRAM</text><text x="42" y="100" font-family="Arial,sans-serif" font-size="38" fill="#171717">Conditioning &amp; Endurance Circuit</text><text x="42" y="140" font-family="Arial,sans-serif" font-size="21" fill="#555">Rotate through four stations at a pace appropriate for your group.</text><rect x="36" y="170" width="735" height="535" rx="24" fill="white" stroke="#ccc"/><circle cx="235" cy="300" r="27" fill="#bf171d"/><text x="227" y="308" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><text x="145" y="360" font-family="Arial,sans-serif" font-size="21" fill="#171717">Controlled steps</text><circle cx="585" cy="300" r="27" fill="#bf171d"/><text x="577" y="308" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><text x="495" y="360" font-family="Arial,sans-serif" font-size="21" fill="#171717">Bodyweight squat</text><circle cx="585" cy="565" r="27" fill="#bf171d"/><text x="577" y="573" font-family="Arial,sans-serif" font-size="23" fill="white">3</text><text x="495" y="625" font-family="Arial,sans-serif" font-size="21" fill="#171717">Easy shuttle</text><circle cx="235" cy="565" r="27" fill="#bf171d"/><text x="227" y="573" font-family="Arial,sans-serif" font-size="23" fill="white">4</text><text x="145" y="625" font-family="Arial,sans-serif" font-size="21" fill="#171717">Walk and recover</text><path d="M280 300 L535 300" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><path d="M585 360 L585 510" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><path d="M530 565 L290 565" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><path d="M235 515 L235 375" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><circle cx="830" cy="230" r="27" fill="#bf171d"/><text x="822" y="238" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><text x="875" y="224" font-family="Arial,sans-serif" font-size="21" fill="#171717">Set clear station</text><text x="875" y="253" font-family="Arial,sans-serif" font-size="21" fill="#171717">boundaries and</text><text x="875" y="282" font-family="Arial,sans-serif" font-size="21" fill="#171717">demonstrate form.</text><circle cx="830" cy="375" r="27" fill="#bf171d"/><text x="822" y="383" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><text x="875" y="369" font-family="Arial,sans-serif" font-size="21" fill="#171717">Rotate together</text><text x="875" y="398" font-family="Arial,sans-serif" font-size="21" fill="#171717">on the coach’s</text><text x="875" y="427" font-family="Arial,sans-serif" font-size="21" fill="#171717">signal.</text><circle cx="830" cy="520" r="27" fill="#bf171d"/><text x="822" y="528" font-family="Arial,sans-serif" font-size="23" fill="white">3</text><text x="875" y="514" font-family="Arial,sans-serif" font-size="21" fill="#171717">Use the recovery</text><text x="875" y="543" font-family="Arial,sans-serif" font-size="21" fill="#171717">station to reset</text><text x="875" y="572" font-family="Arial,sans-serif" font-size="21" fill="#171717">before repeating.</text><text x="42" y="755" font-family="Arial,sans-serif" font-size="20" fill="#555">Solid arrows: movement   /   Dashed arrows: pass   /   Adapt spacing and pace to your group.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bf171d"/></marker></defs><rect width="1200" height="800" fill="#faf8f3"/><text x="42" y="47" font-family="Arial,sans-serif" font-size="19" fill="#bf171d">THE SQUAD / PRACTICE DIAGRAM</text><text x="42" y="100" font-family="Arial,sans-serif" font-size="38" fill="#171717">Defensive Positioning Fundamentals</text><text x="42" y="140" font-family="Arial,sans-serif" font-size="21" fill="#555">Two-on-two positioning: move with the ball and communicate.</text><rect x="36" y="170" width="735" height="535" rx="24" fill="white" stroke="#ccc"/><path d="M95 225 H710 V660 H95 Z M290 660 V480 H510 V660 M330 620 H470" fill="none" stroke="#bbb" stroke-width="4"/><circle cx="220" cy="300" r="27" fill="#171717"/><text x="212" y="308" font-family="Arial,sans-serif" font-size="23" fill="white">A</text><circle cx="570" cy="300" r="27" fill="#171717"/><text x="562" y="308" font-family="Arial,sans-serif" font-size="23" fill="white">B</text><circle cx="275" cy="410" r="27" fill="#bf171d"/><text x="267" y="418" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><circle cx="505" cy="410" r="27" fill="#bf171d"/><text x="497" y="418" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><path d="M257 300 L533 300" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 8"/><path d="M275 448 L370 505" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><path d="M505 448 L560 505" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><circle cx="830" cy="230" r="27" fill="#bf171d"/><text x="822" y="238" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><text x="875" y="224" font-family="Arial,sans-serif" font-size="21" fill="#171717">Start with two</text><text x="875" y="253" font-family="Arial,sans-serif" font-size="21" fill="#171717">attackers and two</text><text x="875" y="282" font-family="Arial,sans-serif" font-size="21" fill="#171717">defenders.</text><circle cx="830" cy="375" r="27" fill="#bf171d"/><text x="822" y="383" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><text x="875" y="369" font-family="Arial,sans-serif" font-size="21" fill="#171717">Pass across; both</text><text x="875" y="398" font-family="Arial,sans-serif" font-size="21" fill="#171717">defenders adjust</text><text x="875" y="427" font-family="Arial,sans-serif" font-size="21" fill="#171717">their positions.</text><circle cx="830" cy="520" r="27" fill="#bf171d"/><text x="822" y="528" font-family="Arial,sans-serif" font-size="23" fill="white">3</text><text x="875" y="514" font-family="Arial,sans-serif" font-size="21" fill="#171717">Call the ball,</text><text x="875" y="543" font-family="Arial,sans-serif" font-size="21" fill="#171717">keep your partner</text><text x="875" y="572" font-family="Arial,sans-serif" font-size="21" fill="#171717">in view, then reset.</text><text x="42" y="755" font-family="Arial,sans-serif" font-size="20" fill="#555">Solid arrows: movement   /   Dashed arrows: pass   /   Adapt spacing and pace to your group.</text></svg>
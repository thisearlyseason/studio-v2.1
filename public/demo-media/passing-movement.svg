<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bf171d"/></marker></defs><rect width="1200" height="800" fill="#faf8f3"/><text x="42" y="47" font-family="Arial,sans-serif" font-size="19" fill="#bf171d">THE SQUAD / PRACTICE DIAGRAM</text><text x="42" y="100" font-family="Arial,sans-serif" font-size="38" fill="#171717">Team Passing &amp; Movement Patterns</text><text x="42" y="140" font-family="Arial,sans-serif" font-size="21" fill="#555">Pass, follow your pass, and offer the next player a clear target.</text><rect x="36" y="170" width="735" height="535" rx="24" fill="white" stroke="#ccc"/><circle cx="400" cy="245" r="27" fill="#171717"/><text x="392" y="253" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><circle cx="205" cy="580" r="27" fill="#171717"/><text x="197" y="588" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><circle cx="610" cy="580" r="27" fill="#171717"/><text x="602" y="588" font-family="Arial,sans-serif" font-size="23" fill="white">3</text><path d="M370 275 L235 538" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 8"/><path d="M245 580 L565 580" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 8"/><path d="M584 540 L430 280" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="10 8"/><path d="M475 280 L675 530" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><path d="M640 625 L255 625" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><path d="M155 535 L315 275" fill="none" stroke="#bf171d" stroke-width="5" marker-end="url(#arrow)"/><circle cx="830" cy="230" r="27" fill="#bf171d"/><text x="822" y="238" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><text x="875" y="224" font-family="Arial,sans-serif" font-size="21" fill="#171717">Form a triangle</text><text x="875" y="253" font-family="Arial,sans-serif" font-size="21" fill="#171717">with comfortable</text><text x="875" y="282" font-family="Arial,sans-serif" font-size="21" fill="#171717">passing distances.</text><circle cx="830" cy="375" r="27" fill="#bf171d"/><text x="822" y="383" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><text x="875" y="369" font-family="Arial,sans-serif" font-size="21" fill="#171717">Pass to the next</text><text x="875" y="398" font-family="Arial,sans-serif" font-size="21" fill="#171717">player, then move</text><text x="875" y="427" font-family="Arial,sans-serif" font-size="21" fill="#171717">to that position.</text><circle cx="830" cy="520" r="27" fill="#bf171d"/><text x="822" y="528" font-family="Arial,sans-serif" font-size="23" fill="white">3</text><text x="875" y="514" font-family="Arial,sans-serif" font-size="21" fill="#171717">Call for the ball.</text><text x="875" y="543" font-family="Arial,sans-serif" font-size="21" fill="#171717">Reverse direction</text><text x="875" y="572" font-family="Arial,sans-serif" font-size="21" fill="#171717">after several turns.</text><text x="42" y="755" font-family="Arial,sans-serif" font-size="20" fill="#555">Solid arrows: movement   /   Dashed arrows: pass   /   Adapt spacing and pace to your group.</text></svg>
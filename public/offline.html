<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <title>The Squad is offline</title>
    <style>
      body { align-items: center; background: #09090b; color: #fff; display: flex; font: 16px system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
      main { max-width: 28rem; }
      h1 { font-size: 2rem; margin: 0 0 .75rem; }
      p { color: #d4d4d8; line-height: 1.5; }
      button { background: #dc2626; border: 0; border-radius: .5rem; color: #fff; cursor: pointer; font-weight: 700; margin-top: 1rem; padding: .75rem 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>The Squad is offline</h1>
      <p>Reconnect to continue securely. Personal team data is never stored for offline use.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>

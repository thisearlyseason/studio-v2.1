
# Staging App Hosting configuration. Production web traffic is served by the
# Vercel project documented in docs/release-runbook.md.
# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runtime: nodejs24

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://studio--the-squad-v2-staging.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_WEBAPP_CONFIG
    value: '{"projectId":"the-squad-v2-staging","appId":"1:100620894746:web:5d5a2d05022ea6fc1d87a3","storageBucket":"the-squad-v2-staging.firebasestorage.app","apiKey":"AIzaSyBdH-iUTHwGketG0RQ1Lx1r3HImg3Rxp9M","authDomain":"the-squad-v2-staging.firebaseapp.com","messagingSenderId":"100620894746"}'
    availability:
      - BUILD
      - RUNTIME
  - variable: CALENDAR_FEED_BASE_URL
    value: https://us-central1-the-squad-v2-staging.cloudfunctions.net/getCalendarFeed
    availability:
      - RUNTIME

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 10
  memory: 512Mi

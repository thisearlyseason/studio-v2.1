name: Production Firebase health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  firebase-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Verify deployed Functions and billing-backed invocation
        run: |
          npx --yes firebase-tools@15.23.0 functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/functions.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/functions.json', 'utf8'));
          const ids = new Set((payload.result || []).map(fn => fn.id));
          const required = ['getCalendarFeed', 'redeemLeagueInvite', 'purgeExpiredDeletionRequests', 'cleanupAnonymousUsers', 'sendUpcomingEventReminders'];
          const missing = required.filter(id => !ids.has(id));
          if (missing.length) throw new Error(`Missing production Functions: ${missing.join(', ')}`);
          const url = `https://us-central1-${process.env.FIREBASE_PROJECT_ID}.cloudfunctions.net/getCalendarFeed?token=invalid-health-check`;
          const response = await fetch(url);
          if (response.status !== 400) throw new Error(`Function invocation failed with HTTP ${response.status}; verify Firebase billing and runtime health.`);
          NODE

name: Deploy staging

on:
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    name: Verify and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
      APPHOSTING_BACKEND_ID: ${{ vars.STAGING_APPHOSTING_BACKEND_ID }}
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run verify

      - name: Validate staging configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$APPHOSTING_BACKEND_ID"
          test -n "$STAGING_APP_URL"
          case "$STAGING_APP_URL" in https://*) ;; *) exit 1 ;; esac
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify App Hosting target ownership
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          backend_json="$(npx firebase apphosting:backends:get "$APPHOSTING_BACKEND_ID" --project "$FIREBASE_PROJECT_ID" --json)"
          node - "$backend_json" "$GITHUB_REPOSITORY" "$STAGING_APP_URL" <<'NODE'
          const [raw, repository, appUrl] = process.argv.slice(2);
          let payload;
          try {
            payload = JSON.parse(raw);
          } catch {
            throw new Error('App Hosting backend metadata was not valid JSON');
          }
          const backend = payload?.result;
          if (!backend?.uri || !backend?.codebase?.repository) {
            throw new Error('App Hosting backend is missing canonical URI or repository metadata');
          }
          const expectedLink = repository.replace(/[\/.]/g, '-');
          if (!backend.codebase.repository.endsWith(`/gitRepositoryLinks/${expectedLink}`)) {
            throw new Error(`App Hosting backend is linked to ${backend.codebase.repository}, not ${repository}`);
          }
          const configured = new URL(appUrl);
          const canonical = new URL(`https://${backend.uri}`);
          if (configured.origin !== canonical.origin) {
            throw new Error(`STAGING_APP_URL must match ${canonical.origin}`);
          }
          NODE

      - name: Deploy Firestore indexes
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:indexes --non-interactive

      - name: Deploy Functions
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive --force

      - name: Deploy Firestore and Storage rules
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules,storage --non-interactive

      - name: Roll out App Hosting commit
        run: >-
          npx firebase apphosting:rollouts:create "$APPHOSTING_BACKEND_ID"
          --project "$FIREBASE_PROJECT_ID"
          --git-commit "$GITHUB_SHA"
          --force

      - name: Verify staging health
        run: |
          for attempt in 1 2 3 4 5 6; do
            payload="$(curl --fail --silent --show-error --max-time 15 "${STAGING_APP_URL%/}/api/health")" || true
            if node -e 'const body = JSON.parse(process.argv[1]); process.exit(body.status === "ok" && body.service === "the-squad-web" ? 0 : 1)' "$payload" 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

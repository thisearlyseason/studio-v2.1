name: Deploy production infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: Type the production Firebase project ID
        required: true
        type: string

concurrency:
  group: production-infrastructure-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    name: Verify and deploy production infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate production target
        env:
          CONFIRMED_PROJECT: ${{ inputs.confirm_project }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "studio-6850142148-fe343"
          test "$CONFIRMED_PROJECT" = "$FIREBASE_PROJECT_ID"
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Apply and verify the calendar membership index
        run: |
          python3 scripts/deploy-calendar-membership-index.py

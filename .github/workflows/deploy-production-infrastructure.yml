name: Deploy production infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: Type the production Firebase project ID
        required: true
        type: string

concurrency:
  group: production-infrastructure-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    name: Verify and deploy production infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.PRODUCTION_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix functions audit --omit=dev --audit-level=high

      - name: Validate production target
        env:
          CONFIRMED_PROJECT: ${{ inputs.confirm_project }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "studio-6850142148-fe343"
          test "$CONFIRMED_PROJECT" = "$FIREBASE_PROJECT_ID"
          test -n "$WORKLOAD_IDENTITY_PROVIDER"
          test -n "$SERVICE_ACCOUNT"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Firestore indexes
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:indexes --non-interactive

      - name: Deploy Functions
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive --force

      - name: Deploy Firestore and Storage rules
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules,storage --non-interactive

      - name: Verify deployed Firestore rules match this revision
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaserules.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/releases/cloud.firestore" \
            > "$RUNNER_TEMP/firestore-release.json"
          RULESET_NAME="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).rulesetName" "$RUNNER_TEMP/firestore-release.json")"
          curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaserules.googleapis.com/v1/$RULESET_NAME" \
            > "$RUNNER_TEMP/firestore-ruleset.json"
          node scripts/check-firestore-rules-drift.mjs firestore.rules "$RUNNER_TEMP/firestore-ruleset.json"

      - name: Verify production Functions
        run: |
          npx firebase functions:list --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/functions.json"
          node - "$RUNNER_TEMP/functions.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const ids = new Set((payload.result || []).map(fn => fn.id));
          if (!ids.has('getCalendarFeed')) throw new Error('getCalendarFeed is not deployed');
          for (const retired of ['connectGoogleCalendar', 'onEventCreate', 'onEventUpdate', 'onEventDelete']) {
            if (ids.has(retired)) throw new Error(`${retired} is still deployed`);
          }
          NODE

      - name: Verify calendar endpoint
        run: |
          node --input-type=module <<'NODE'
          const project = process.env.FIREBASE_PROJECT_ID;
          const url = `https://us-central1-${project}.cloudfunctions.net/getCalendarFeed?token=invalid-readiness-check`;
          const response = await fetch(url);
          if (response.status !== 400) throw new Error(`Expected HTTP 400, received ${response.status}`);
          NODE
